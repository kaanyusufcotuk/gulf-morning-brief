name: Search news

on:
  workflow_dispatch:
    inputs:
      start:
        description: Start date (YYYY-MM-DD)
        required: true
        type: string
      end:
        description: End date (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: search-news
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
    steps:
      - uses: actions/checkout@v4

      - name: Search Google News
        run: python3 scripts/search_news.py

      - name: Commit candidates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Search news: $START to $END"
          git pull --rebase origin main
          git push
