<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Gulf Morning Brief</title><meta name="description" content="Daily news scan for Saudi Arabia, UAE, Qatar, Kuwait, Bahrain, Oman and Iraq."><meta property="og:title" content="Gulf Morning Brief"><meta property="og:description" content="Daily news scan for the Gulf and Iraq."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..650,0..100&family=Nunito:wght@400;500;600;700&display=swap"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --accent:#46704c;--accent-deep:#355a3b;--soft:#e4ebd9;--soft-2:#eef1e3;--bg:#f6f0e1;--surface:#fcf8ee;--ink:#2e3a2f;--muted:#6a7363;--line:#e3d9c2;--line-soft:#ece4d1;--second:#a8864e;--alarm:#a14b3d;--alarm-soft:#f5e2da;--shadow:0 2px 12px rgba(70,90,60,.07);--radius:14px}

:root[data-theme="dark"]{color-scheme:dark;--accent:#9cc39a;--accent-deep:#b7d6b2;--soft:#2a3a2c;--soft-2:#232e24;--bg:#1a201b;--surface:#212922;--ink:#ece5d3;--muted:#a8ad9b;--line:#344033;--line-soft:#2a332a;--second:#d4b27a;--alarm:#e8a091;--alarm-soft:#3a2521;--shadow:none}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
 font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.wrap{max-width:860px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
body.editor .wrap{padding-bottom:140px}

.masthead{margin-top:24px;padding:30px 28px 20px;background:linear-gradient(160deg,var(--soft) 0%,var(--soft-2) 100%);border-radius:calc(var(--radius) + 6px);border:1px solid var(--line-soft)}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
h1{font-family:Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100;font-weight:560;font-size:clamp(34px,8vw,52px);line-height:1.05;margin:0;letter-spacing:-.015em;color:var(--accent-deep);text-wrap:balance}
.dateline{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-top:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dateline b{color:var(--ink);font-weight:700}

.editor-note{margin:16px 0 0;padding:12px 16px;background:var(--surface);border:1px solid var(--line-soft);border-left:4px solid var(--second);border-radius:var(--radius);box-shadow:var(--shadow);font-size:14px;color:var(--muted)}
.editor-note b{color:var(--ink);font-weight:700}

.controls{display:flex;flex-direction:column;gap:10px;padding-block:18px 16px;border-bottom:1px solid var(--line)}
.search{width:100%;min-height:46px;padding:0 18px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;transition:border-color .2s,box-shadow .2s}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:36px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;transition:background-color .2s,border-color .2s,color .2s}
.fchip:hover{background:var(--soft);border-color:var(--soft)}
.fchip .n{opacity:.6;margin-left:6px;font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.fchip.alarm{color:var(--alarm);border-color:var(--alarm)}
.fchip.alarm:hover{background:var(--alarm-soft)}
.fchip.alarm[aria-pressed="true"]{background:var(--alarm);color:var(--bg)}
.onlysel{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-size:14px;cursor:pointer;align-self:flex-start}
.onlysel input{width:20px;height:20px;accent-color:var(--accent)}

section.country{margin-top:16px;padding:6px 20px 10px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);box-shadow:var(--shadow)}
.chead{margin:0}
.ctoggle{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;width:100%;min-height:48px;padding:10px 0 8px;background:none;border:0;text-align:left;cursor:pointer}
.cname{font-family:Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100;font-weight:540;font-size:25px;letter-spacing:-.005em;color:var(--accent-deep)}
.cmeta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{margin-left:auto;align-self:center;width:9px;height:9px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);border-radius:1px;transform:rotate(45deg);margin-right:4px;transition:transform .25s ease}
.ctoggle[aria-expanded="false"] .chev{transform:rotate(-45deg)}

ol.items{list-style:none;margin:0;padding:4px 0 0;display:flex;flex-direction:column}
.story{border-top:1px solid var(--line-soft);padding-block:14px}
.story:first-child{border-top:none}
body.editor .story{display:grid;grid-template-columns:44px 1fr;align-items:start;border-radius:10px;transition:background-color .2s}
body.editor .story.sel{background:var(--soft);box-shadow:inset 4px 0 0 var(--accent)}
.pick{display:grid;place-items:center;width:44px;height:44px;margin-top:-11px;cursor:pointer}
.pick input{width:22px;height:22px;margin:0;accent-color:var(--accent);cursor:pointer}
.body{min-width:0}
.headline{display:block;font-size:17px;line-height:1.42;font-weight:600;text-decoration:none;text-underline-offset:4px;text-wrap:pretty;overflow-wrap:anywhere;transition:color .2s}
.headline:hover{color:var(--accent-deep);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:1.5px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.meta .src{color:var(--ink);opacity:.8;font-weight:600}
.meta .sep{opacity:.35}
.meta .time{font-variant-numeric:tabular-nums}
.chip{font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:3px 11px;border-radius:999px;background:var(--soft);color:var(--accent-deep);white-space:nowrap}
.chip.alarm{background:var(--alarm-soft);color:var(--alarm)}
.chip.outline{background:none;border:1px solid var(--line);color:var(--muted)}
.more{display:block;min-height:44px;padding:0;background:none;border:0;color:var(--accent);font-size:14px;font-weight:700;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;cursor:pointer}

.empty{margin-top:22px;padding:14px 18px;background:var(--surface);border:1px solid var(--line-soft);border-left:4px solid var(--second);border-radius:var(--radius);box-shadow:var(--shadow);font-size:14.5px;color:var(--muted)}
section.country .empty{margin-top:4px;box-shadow:none}
.empty button{margin-left:6px;padding:0;background:none;border:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:4px;cursor:pointer}

footer{margin-top:40px;padding:20px 22px;background:var(--soft-2);border-radius:var(--radius);font-size:12.5px;color:var(--muted);line-height:1.75}
footer b{color:var(--accent-deep);font-weight:700}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(70,90,60,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.bar-info{font-size:14px;min-width:0}
.bar-info b{font-weight:700}
.bar-status{display:block;font-size:12.5px;color:var(--muted);min-height:18px}
.bar-actions{display:flex;gap:8px;margin-left:auto}
.btn{min-height:44px;padding:0 18px;border:1px solid var(--accent);border-radius:999px;background:none;color:var(--accent);font-size:14px;font-weight:700;cursor:pointer;transition:background-color .2s,color .2s}
.btn:hover:not(:disabled){background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--bg)}
.btn.primary:hover:not(:disabled){background:var(--accent-deep)}
.btn:disabled{opacity:.45;cursor:default}

@media (max-width:480px){.wrap{padding-inline:16px}.masthead{padding:24px 20px 18px}section.country{padding-inline:16px}.headline{font-size:16px}.cname{font-size:23px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.editor-note a{color:var(--accent);font-weight:700}

.scan{margin-top:16px;padding:18px 20px;background:var(--soft-2);border:1px solid var(--line-soft);border-radius:var(--radius)}
.scan-title{margin:0;font-family:Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100;font-weight:540;font-size:21px;color:var(--accent-deep)}
.scan-help{margin:4px 0 14px;font-size:14px;color:var(--muted)}
.scan-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.scan-row label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.scan input[type="date"]{min-height:44px;padding:0 14px;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px}
.scan input:disabled{opacity:.6}
.scan .bar-status{margin-top:8px}
.bar-status.err{color:var(--alarm)}
.ilink{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ifield{flex:1 1 220px;min-width:0;min-height:40px;padding:0 14px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;transition:border-color .2s,box-shadow .2s}
.ifield:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.ifield.bad{border-color:var(--alarm)}
.ifield::placeholder{color:var(--muted)}
.mini{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--accent);font-size:13px;font-weight:700;cursor:pointer}
.mini:hover{background:var(--soft)}
.chip.inflow{background:var(--accent);color:var(--bg)}
.scan-token{margin-top:6px;font-size:14px}
.scan-token summary{cursor:pointer;font-weight:700;color:var(--accent);padding-block:6px}
.scan-token p{margin:4px 0 10px;color:var(--muted)}
.scan-token .search{flex:1 1 220px;width:auto}

<script>(function () {
'use strict';

var CAT = {
  emergency: 'Emergency', economy: 'Economy', politics: 'Politics',
  ecommerce: 'E-commerce & retail', logistics: 'Logistics & shipping',
  payments: 'Payments & fintech', tax: 'Tax & incentives', turkey: 'T\u00fcrkiye link'
};
var CAT_ORDER = Object.keys(CAT);
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var FIRST_OPEN = 5;
var REPO = (function () {
  var m = /^([a-z0-9-]+)\.github\.io$/i.exec(location.hostname), seg = location.pathname.split('/')[1];
  return m && seg ? m[1] + '/' + seg : 'kaanyusufcotuk/gulf-morning-brief';
})();
var WORKFLOW = 'search.yml', TKEY = 'gmb:token', MAX_DAYS = 14;

var SAVE_DELAY = 2500;

var DATA, LIVE, published, draft, isEditor, searching = false;
var f = { country: 'all', cat: 'all', q: '', only: false };
var collapsed = {}, expanded = {};
var statusTimer = null;
var saveTimer = null, saving = false, saveState = '', saveMsg = '', edits = 0;

var $ = function (id) { return document.getElementById(id); };
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : '#'; }
function fmtDay(iso) { var p = iso.split('-'); return MONTHS[+p[1] - 1] + ' ' + (+p[2]); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

function sameSet(a, b) {
  if (a.size !== b.size) return false;
  var ok = true;
  a.forEach(function (x) { if (!b.has(x)) ok = false; });
  return ok;
}
function rank(s) { return s.k === 'emergency' ? 0 : s.k === 'economy' ? 1 : 2; }
function sorted(list) {
  return list.slice().sort(function (a, b) {
    var r = rank(a) - rank(b);
    if (r) return r;
    if (a.d !== b.d) return a.d < b.d ? 1 : -1;
    return a.n - b.n;
  });
}
function pool() { return isEditor ? DATA.stories : DATA.stories.filter(function (s) { return published.has(s.id); }); }
function isSel(s) { return isEditor ? draft.has(s.id) : published.has(s.id); }
function match(s, skip) {
  if (skip !== 'country' && f.country !== 'all' && s.c !== f.country) return false;
  if (skip !== 'cat' && f.cat !== 'all' && s.k !== f.cat) return false;
  if (f.q && (s.t + ' ' + s.s).toLowerCase().indexOf(f.q.toLowerCase()) < 0) return false;
  if (isEditor && f.only && !draft.has(s.id)) return false;
  return true;
}
function filtering() { return f.country !== 'all' || f.cat !== 'all' || !!f.q || (isEditor && f.only); }

/* ---------- rendering ---------- */

function renderShell() {
  $('root').innerHTML =
    '<div class="wrap">' +
    '<header class="masthead"><p class="kicker">GCC + IRAQ \u00b7 DAILY SCAN</p><h1>Gulf Morning Brief</h1><div class="dateline" id="dateline"></div></header>' +
    '<div id="note"></div>' +
    (isEditor ? scanHtml() : '') +
    '<div class="controls" id="controls">' +
      '<input class="search" id="q" type="search" placeholder="Search headlines" aria-label="Search headlines" autocomplete="off">' +
      '<div class="chips" id="cchips" role="group" aria-label="Filter by country"></div>' +
      '<div class="chips" id="kchips" role="group" aria-label="Filter by category"></div>' +
      '<div id="onlywrap"></div>' +
    '</div>' +
    '<main id="list"></main>' +
    '<footer id="foot"></footer>' +
    '</div><div id="barwrap"></div>';
}

function renderHead() {
  var p = pool(), countries = {};
  p.forEach(function (s) { countries[s.c] = true; });
  var nC = Object.keys(countries).length;
  var h = '<span><b>' + esc(DATA.edition.label) + '</b></span>';
  if (DATA.edition.windowLabel) h += '<span>' + esc(DATA.edition.windowLabel) + '</span>';
  if (isEditor) {
    h += '<span><b>' + DATA.stories.length + '</b> candidates \u00b7 <b>' + draft.size + '</b> selected</span>';
  } else if (published.size) {
    h += '<span><b>' + published.size + '</b> ' + (published.size === 1 ? 'story' : 'stories') + ' \u00b7 <b>' + nC + '</b> ' + (nC === 1 ? 'country' : 'countries') + '</span>';
  } else {
    h += '<span>Selection pending</span>';
  }
  if (DATA.edition.scanned) h += '<span>scanned ' + esc(DATA.edition.scanned) + '</span>';
  $('dateline').innerHTML = h;
  var n = published.size;
  document.title = 'Gulf Morning Brief \u00b7 ' + DATA.edition.titleDate + (n ? ' \u00b7 ' + plural(n, 'story', 'stories') : '');
}

function scanHtml() {
  var hasTok = !!getToken();
  return '<section class="scan" aria-labelledby="scan-title">' +
    '<h2 class="scan-title" id="scan-title">New search</h2>' +
    '<p class="scan-help">Pick a date range and the site searches Google News for every country. The results replace the list below so you can tick what to publish. Takes about a minute.</p>' +
    '<div class="scan-row">' +
      '<label>From<input type="date" id="sfrom" value="' + isoDay(-1) + '" max="' + isoDay(0) + '"></label>' +
      '<label>To<input type="date" id="sto" value="' + isoDay(0) + '" max="' + isoDay(0) + '"></label>' +
      '<button type="button" class="btn primary" id="sgo" data-act="search">Search</button>' +
    '</div>' +
    '<span class="bar-status" id="sstatus" aria-live="polite"></span>' +
    '<details class="scan-token" id="stoken"' + (hasTok ? '' : ' open') + '><summary id="stoksum">GitHub access key · ' + (hasTok ? 'saved' : 'not set') + '</summary>' +
      '<p>Searching and publishing happen on GitHub, so this page needs a key for the repository. Create a fine-grained token at <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">github.com/settings/personal-access-tokens</a> with access to only <b>' + esc(REPO.split('/')[1]) + '</b> and these permissions: <b>Actions: Read and write</b>, <b>Contents: Read and write</b>. The key is kept in this browser only.</p>' +
      '<div class="scan-row"><input class="search" id="tok" type="password" placeholder="github_pat_…" aria-label="GitHub access key" autocomplete="off">' +
      '<button type="button" class="btn" data-act="savetok">Save</button><button type="button" class="btn" data-act="cleartok">Remove</button></div>' +
    '</details></section>';
}

function renderNote() {
  var fresh = DATA !== LIVE && !sameEdition(DATA, LIVE);
  $('note').innerHTML = isEditor
    ? '<p class="editor-note"><b>Editor view.</b> Tick the stories to publish. Every change is published automatically a few seconds later, and the live link shows it within about a minute. <a href="./">View the live site</a>' +
      (getToken() ? '' : '<br><b>Add your GitHub access key below to publish.</b> Without it, changes stay on this page only.') +
      (fresh ? '<br><b>Showing new search results for ' + esc(DATA.edition.label) + '.</b> The live site still shows ' + esc(LIVE.edition.label) + ' and switches to these results when you tick your first story.' : '') + '</p>'
    : '';
  document.body.classList.toggle('editor', isEditor);
}

function chipHtml(attr, val, label, count, active, alarm) {
  return '<button type="button" class="fchip' + (alarm ? ' alarm' : '') + '" data-' + attr + '="' + esc(val) + '" aria-pressed="' + (active ? 'true' : 'false') + '">' +
    esc(label) + '<span class="n">' + count + '</span></button>';
}

function renderControls() {
  var p = pool();
  var cc = chipHtml('country', 'all', 'All', p.filter(function (s) { return match(s, 'country'); }).length, f.country === 'all');
  DATA.countries.forEach(function (c) {
    if (!p.some(function (s) { return s.c === c.id; })) return;
    cc += chipHtml('country', c.id, c.short, p.filter(function (s) { return s.c === c.id && match(s, 'country'); }).length, f.country === c.id);
  });
  $('cchips').innerHTML = cc;
  var kc = chipHtml('cat', 'all', 'All topics', p.filter(function (s) { return match(s, 'cat'); }).length, f.cat === 'all');
  CAT_ORDER.forEach(function (k) {
    if (!p.some(function (s) { return s.k === k; })) return;
    kc += chipHtml('cat', k, CAT[k], p.filter(function (s) { return s.k === k && match(s, 'cat'); }).length, f.cat === k, k === 'emergency');
  });
  $('kchips').innerHTML = kc;
  $('onlywrap').innerHTML = isEditor
    ? '<label class="onlysel"><input type="checkbox" id="only"' + (f.only ? ' checked' : '') + '> Only selected</label>' : '';
  $('controls').hidden = p.length === 0;
}

function storyHtml(s) {
  var sel = isSel(s);
  var pick = isEditor
    ? '<label class="pick"><input type="checkbox" data-pick="' + esc(s.id) + '"' + (sel ? ' checked' : '') + ' aria-label="Select: ' + esc(s.t) + '"></label>' : '';
  var chips = '<span class="chip' + (s.k === 'emergency' ? ' alarm' : '') + '">' + esc(CAT[s.k] || s.k) + '</span>' +
    (s.r ? '<span class="chip outline">roundup</span>' : '') +
    (isEditor && s.iu ? '<span class="chip inflow">inflow.bio</span>' : '');
  // Readers go through the inflow.bio link when one is set; the editor keeps the original.
  var href = isEditor ? s.u : (s.iu || s.u);
  var ilink = isEditor && sel
    ? '<div class="ilink"><input class="ifield" type="url" inputmode="url" data-inflow="' + esc(s.id) + '" value="' + esc(s.iu || '') + '" placeholder="Paste the inflow.bio link" aria-label="inflow.bio link for: ' + esc(s.t) + '" autocomplete="off" spellcheck="false">' +
      '<button type="button" class="mini" data-copyurl="' + esc(s.id) + '">Copy original link</button></div>'
    : '';
  return '<li class="story' + (isEditor && sel ? ' sel' : '') + '">' + pick +
    '<div class="body"><a class="headline" href="' + esc(safeUrl(href)) + '" target="_blank" rel="noopener noreferrer">' + esc(s.t) + '</a>' +
    '<div class="meta">' + chips + '<span class="src">' + esc(s.s) + '</span><span class="sep">\u00b7</span><span class="time">' + fmtDay(s.d) + '</span></div>' + ilink + '</div></li>';
}

function renderList() {
  var act = document.activeElement;
  var keepId = act && act.getAttribute && act.getAttribute('data-pick');
  var p = pool(), fl = filtering(), html = '', shown = 0;
  if (!isEditor && p.length === 0) {
    $('list').innerHTML = '<p class="empty">Today\u2019s stories haven\u2019t been selected yet. Check back soon.</p>';
    return;
  }
  DATA.countries.forEach(function (c) {
    var all = p.filter(function (s) { return s.c === c.id; });
    if (!all.length && (fl || !isEditor)) return;
    var list = sorted(all.filter(function (s) { return match(s); }));
    if (fl && !list.length) return;
    shown += list.length;
    var open = !collapsed[c.id];
    var limit = fl || expanded[c.id] ? list.length : FIRST_OPEN;
    var meta = esc(c.capital) + ' \u00b7 ';
    if (isEditor) {
      var nSel = all.filter(function (s) { return draft.has(s.id); }).length;
      meta += nSel + ' of ' + plural(all.length, 'story', 'stories') + ' selected';
    } else {
      meta += plural(all.length, 'story', 'stories');
    }
    html += '<section class="country"><h2 class="chead"><button type="button" class="ctoggle" data-toggle="' + c.id + '" aria-expanded="' + open + '" aria-controls="list-' + c.id + '">' +
      '<span class="cname">' + esc(c.name) + '</span><span class="cmeta">' + meta + '</span><span class="chev" aria-hidden="true"></span></button></h2>';
    if (open) {
      if (!all.length) {
        html += '<p class="empty">No verified stories for this country in this edition.</p>';
      } else {
        html += '<ol class="items" id="list-' + c.id + '">' + list.slice(0, limit).map(storyHtml).join('') + '</ol>';
        if (list.length > limit) html += '<button type="button" class="more" data-more="' + c.id + '">Show ' + (list.length - limit) + ' more</button>';
      }
    }
    html += '</section>';
  });
  if (fl && shown === 0) html = '<p class="empty">No stories match these filters.<button type="button" data-reset="1">Clear filters</button></p>';
  $('list').innerHTML = html;
  if (keepId) {
    var el = $('list').querySelector('[data-pick="' + keepId + '"]');
    if (el) el.focus();
  }
}

function fmtStamp(iso) {
  try {
    return new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Istanbul' }).format(new Date(iso)) + ' Istanbul';
  } catch (e) { return ''; }
}

function renderFoot() {
  var h = (DATA.footer || []).map(function (l) { return esc(l); }).join('<br>');
  var ck = DATA.checks;
  if (ck) h += '<br>Every link was checked before publishing. Left out: ' + ck.dead + ' that did not open, ' + ck.nodate + ' without a verifiable date, ' + ck.paywall + ' behind a paywall.';
  if (!DATA.edition.generatedAt) h += '<br><b>Refreshed daily at 11:29 Istanbul</b>';
  if (DATA.edition.updated) h += ' \u00b7 last scan ' + esc(DATA.edition.updated);
  if (DATA.curatedAt) { var st = fmtStamp(DATA.curatedAt); if (st) h += ' \u00b7 selection published ' + esc(st); }
  $('foot').innerHTML = h;
}

function renderBar() {
  var w = $('barwrap');
  if (!isEditor) { w.innerHTML = ''; return; }
  w.innerHTML =
    '<div class="bar" role="region" aria-label="Editor actions"><div class="bar-in">' +
    '<div class="bar-info"><b>' + draft.size + '</b> selected · <b>' + withInflow() + '</b> with inflow.bio link' +
    '<span class="bar-status' + (saveState === 'error' ? ' err' : '') + '" id="status" aria-live="polite">' + esc(saveMsg) + '</span></div>' +
    '<div class="bar-actions">' +
    (saveState === 'error' && getToken() ? '<button type="button" class="btn primary" data-act="retry">Try again</button>' : '') +
    '<button type="button" class="btn" data-act="clear"' + (draft.size ? '' : ' disabled') + '>Clear</button>' +
    '<button type="button" class="btn" data-act="copy"' + (draft.size ? '' : ' disabled') + '>Copy</button>' +
    '</div></div></div>';
}

function renderAll() { renderNote(); renderHead(); renderControls(); renderList(); renderFoot(); renderBar(); }

// Short-lived messages (like "Copied") that give way to the publish status.
function setStatus(t) {
  var el = $('status');
  if (el) el.textContent = t;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(function () { var e2 = $('status'); if (e2) e2.textContent = saveMsg; }, 4000);
}

function setSave(state, msg) {
  saveState = state; saveMsg = msg;
  clearTimeout(statusTimer);
  renderBar();
}

/* ---------- publishing ---------- */

function b64(str) {
  var bytes = new TextEncoder().encode(str), bin = '';
  for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

function scheduleSave() {
  edits++;
  clearTimeout(saveTimer); saveTimer = null;
  if (!getToken()) { setSave('error', 'Not published: add your GitHub access key in the New search box.'); return; }
  setSave('pending', 'Publishing in a moment\u2026');
  saveTimer = setTimeout(publish, SAVE_DELAY);
}

function putData(next, tries) {
  return gh('/contents/data.json?ref=main')
    .then(function (r) {
      if (r.status === 401) throw new Error('GitHub rejected the key. Check that it was pasted fully and hasn\u2019t expired.');
      if (!r.ok) throw new Error('Couldn\u2019t read data.json from GitHub (' + r.status + ').');
      return r.json();
    })
    .then(function (cur) {
      return gh('/contents/data.json', { method: 'PUT', body: {
        message: 'Update selection: ' + plural(next.selected.length, 'story', 'stories') + ' for ' + next.edition.label,
        content: b64(JSON.stringify(next, null, 1) + '\n'),
        sha: cur.sha,
        branch: 'main'
      } });
    })
    .then(function (r) {
      if (r.ok) return;
      // Someone else (or the search job) committed in between: fetch the new sha and retry.
      if ((r.status === 409 || r.status === 422) && tries < 2) return putData(next, tries + 1);
      if (r.status === 403 || r.status === 404) throw new Error('This key can\u2019t change files in ' + REPO + '. Give it Contents: Read and write.');
      throw new Error('GitHub answered ' + r.status + '.');
    });
}

function publish() {
  clearTimeout(saveTimer); saveTimer = null;
  if (saving) return; // the running save reschedules itself if more ticks came in
  saving = true;
  var base = DATA, picked = new Set(draft), mark = edits;
  var next = JSON.parse(JSON.stringify(base));
  next.selected = Array.from(picked);
  next.curatedAt = new Date().toISOString();
  setSave('saving', 'Publishing\u2026');
  putData(next, 0)
    .then(function () {
      if (DATA === base) {
        // Keep editing the same objects so link edits typed during the save aren't lost.
        DATA.selected = next.selected; DATA.curatedAt = next.curatedAt;
        LIVE = DATA; published = picked;
      } else {
        LIVE = next;
      }
      setSave('saved', 'Published. The live link shows it within about a minute.');
      renderNote(); renderHead();
    }, function (e) {
      setSave('error', 'Not published: ' + (e.message || 'something went wrong.'));
    })
    .then(function () {
      saving = false;
      if (saveState === 'saved' && edits !== mark) scheduleSave();
    });
}

window.addEventListener('beforeunload', function (e) {
  if (isEditor && (saveTimer || saving)) { e.preventDefault(); e.returnValue = ''; }
});

/* ---------- actions ---------- */

function copySelected() {
  var lines = ['Gulf Morning Brief \u00b7 ' + DATA.edition.titleDate];
  DATA.countries.forEach(function (c) {
    var list = sorted(DATA.stories.filter(function (s) { return s.c === c.id && draft.has(s.id); }));
    if (!list.length) return;
    lines.push('', c.name);
    list.forEach(function (s) { lines.push('- ' + s.t + ' (' + s.s + ', ' + fmtDay(s.d) + ') ' + (s.iu || s.u)); });
  });
  var text = lines.join('\n');
  function ok() { setStatus('Copied ' + plural(draft.size, 'story', 'stories') + '.'); }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var done = false;
    try { done = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    setStatus(done ? 'Copied ' + plural(draft.size, 'story', 'stories') + '.' : 'Copy isn\u2019t available in this browser.');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
}

function onClick(e) {
  var t = e.target.closest('[data-country],[data-cat],[data-toggle],[data-more],[data-act],[data-reset],[data-copyurl]');
  if (!t) return;
  if (t.hasAttribute('data-copyurl')) {
    var cs = storyById(t.getAttribute('data-copyurl'));
    if (cs) copyText(cs.u, 'Original link copied. Create the inflow.bio link from it, then paste it here.');
    return;
  }
  if (t.hasAttribute('data-country')) { f.country = t.getAttribute('data-country'); renderControls(); renderList(); return; }
  if (t.hasAttribute('data-cat')) { f.cat = t.getAttribute('data-cat'); renderControls(); renderList(); return; }
  if (t.hasAttribute('data-toggle')) { var c = t.getAttribute('data-toggle'); collapsed[c] = !collapsed[c]; renderList(); return; }
  if (t.hasAttribute('data-more')) { expanded[t.getAttribute('data-more')] = true; renderList(); return; }
  if (t.hasAttribute('data-reset')) { f = { country: 'all', cat: 'all', q: '', only: false }; $('q').value = ''; renderControls(); renderList(); return; }
  var act = t.getAttribute('data-act');
  if (act === 'clear') { draft = new Set(); renderHead(); renderControls(); renderList(); scheduleSave(); }
  if (act === 'retry') publish();
  if (act === 'copy') copySelected();
  if (act === 'search') runSearch();
  if (act === 'savetok') {
    var v = $('tok').value.trim();
    if (!v) { scanStatus('Paste the key first.'); return; }
    setToken(v); $('tok').value = ''; $('stoken').open = false;
    $('stoksum').textContent = 'GitHub access key · saved';
    scanStatus('Key saved in this browser.');
    renderNote();
    if (!sameSet(draft, published)) scheduleSave(); else if (saveState === 'error') setSave('', '');
  }
  if (act === 'cleartok') {
    setToken(''); $('tok').value = '';
    $('stoksum').textContent = 'GitHub access key · not set';
    scanStatus('Key removed from this browser.');
    renderNote();
  }
}

/* ---------- search ---------- */

function isoDay(offset) { return new Date(Date.now() + 3 * 36e5 + offset * 864e5).toISOString().slice(0, 10); }
function getToken() { try { return localStorage.getItem(TKEY) || ''; } catch (e) { return ''; } }
function setToken(t) { try { if (t) localStorage.setItem(TKEY, t); else localStorage.removeItem(TKEY); } catch (e) {} }
function scanStatus(t) { var el = $('sstatus'); if (el) el.textContent = t; }

function gh(path, opts) {
  opts = opts || {};
  return fetch('https://api.github.com/repos/' + REPO + path, {
    method: opts.method || 'GET',
    cache: 'no-store',
    headers: {
      Accept: opts.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      Authorization: 'Bearer ' + getToken()
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
}

function readCandidatesApi() {
  return gh('/contents/candidates.json?ref=main', { raw: true }).then(function (r) {
    if (!r.ok) throw new Error('Couldn’t read the results (GitHub answered ' + r.status + '). Check that the key has Contents: Read.');
    return r.json();
  });
}

function waitForRun(t0) {
  return new Promise(function (resolve, reject) {
    var tries = 0;
    (function poll() {
      if (++tries > 150) { reject(new Error('The search is taking too long. Check the Actions tab of the repository on GitHub.')); return; }
      gh('/actions/workflows/' + WORKFLOW + '/runs?event=workflow_dispatch&per_page=5')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          var run = j && j.workflow_runs.filter(function (x) { return Date.parse(x.created_at) >= t0 - 15000; }).pop();
          if (run && run.status === 'completed') {
            if (run.conclusion === 'success') resolve();
            else reject(new Error('The search failed on GitHub (' + run.conclusion + '). Details: ' + run.html_url));
            return;
          }
          scanStatus(!run ? 'Waiting for GitHub to start the search…' : run.status === 'queued' ? 'Queued on GitHub…' : 'Searching… this takes about a minute.');
          setTimeout(poll, 4000);
        }, function () { setTimeout(poll, 4000); });
    })();
  });
}

function setScanBusy(on) {
  searching = on;
  ['sfrom', 'sto', 'sgo'].forEach(function (id) { $(id).disabled = on; });
}

function runSearch() {
  if (searching) return;
  var from = $('sfrom').value, to = $('sto').value;
  if (!from || !to) { scanStatus('Pick both dates.'); return; }
  if (from > to) { scanStatus('The start date is after the end date.'); return; }
  if ((Date.parse(to) - Date.parse(from)) / 864e5 + 1 > MAX_DAYS) { scanStatus('Pick ' + MAX_DAYS + ' days or fewer.'); return; }
  if (!getToken()) { $('stoken').open = true; scanStatus('Add your GitHub access key first.'); return; }
  setScanBusy(true);
  scanStatus('Starting the search…');
  var t0 = Date.now();
  gh('/actions/workflows/' + WORKFLOW + '/dispatches', { method: 'POST', body: { ref: 'main', inputs: { start: from, end: to } } })
    .then(function (r) {
      if (r.status === 204) return waitForRun(t0);
      if (r.status === 401) throw new Error('GitHub rejected the key. Check that it was pasted fully and hasn’t expired.');
      if (r.status === 403 || r.status === 404) throw new Error('This key can’t start searches on ' + REPO + '. Give it Actions: Read and write for this repository.');
      throw new Error('GitHub answered ' + r.status + '. Try again in a minute.');
    })
    .then(function () { scanStatus('Search finished. Loading results…'); return readCandidatesApi(); })
    .then(function (c) {
      load(c);
      scanStatus(c.stories.length ? 'Found ' + plural(c.stories.length, 'story', 'stories') + '. Tick the ones to publish.' : 'The search found no stories for these dates.');
    })
    .catch(function (e) { scanStatus(e.message || 'Something went wrong. Try again.'); })
    .then(function () { setScanBusy(false); });
}

function onChange(e) {
  var t = e.target;
  if (t.hasAttribute && t.hasAttribute('data-pick')) {
    var id = t.getAttribute('data-pick');
    if (t.checked) draft.add(id); else draft.delete(id);
    renderHead();
    if (f.only) renderControls();
    renderList(); scheduleSave();
    return;
  }
  if (t.hasAttribute && t.hasAttribute('data-inflow')) { setInflow(t); return; }
  if (t.id === 'only') { f.only = t.checked; renderControls(); renderList(); }
}

function storyById(id) { return DATA.stories.filter(function (s) { return s.id === id; })[0]; }
function withInflow() { return DATA.stories.filter(function (s) { return s.iu && draft.has(s.id); }).length; }

function setInflow(input) {
  var s = storyById(input.getAttribute('data-inflow'));
  if (!s) return;
  var v = input.value.trim();
  if (v && !/^https?:\/\/[^\s"'<>]+$/i.test(v)) {
    input.classList.add('bad');
    setStatus('That doesn’t look like a link. Paste the full address, starting with https://');
    return;
  }
  input.classList.remove('bad');
  if ((s.iu || '') === v) return;
  if (v) s.iu = v; else delete s.iu;
  renderList(); scheduleSave();
}

function copyText(text, okMsg) {
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var done = false;
    try { done = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    setStatus(done ? okMsg : 'Copy isn’t available in this browser.');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { setStatus(okMsg); }, fallback); else fallback();
}

function editorFromPage() { return window.GMB_EDITOR === true; }

function sameEdition(a, b) { return a === b || (!!a.edition.generatedAt && a.edition.generatedAt === b.edition.generatedAt); }

// Show new search results only if they are newer than what the live site has.
function newer(cand, live) {
  var g = cand && cand.edition && cand.edition.generatedAt;
  return !!g && Array.isArray(cand.stories) && !sameEdition(cand, live) && g > (live.curatedAt || '');
}

function load(data) {
  if (saveTimer) publish(); // send pending ticks for the old list before switching
  DATA = data;
  published = new Set(sameEdition(DATA, LIVE) ? LIVE.selected : []);
  draft = new Set(published);
  f = { country: 'all', cat: 'all', q: '', only: false };
  collapsed = {}; expanded = {};
  $('q').value = '';
  renderAll();
}

function start(live, cand) {
  LIVE = live;
  isEditor = editorFromPage();
  renderShell();
  $('root').addEventListener('click', onClick);
  $('root').addEventListener('change', onChange);
  $('q').addEventListener('input', function (e) { f.q = e.target.value.trim(); renderControls(); renderList(); });
  load(newer(cand, live) ? cand : live);
}

function fail() {
  $('root').innerHTML = '<div class="wrap"><header class="masthead"><h1>Gulf Morning Brief</h1></header>' +
    '<p class="empty">Couldn\u2019t load the stories. Open this page through its web address instead of as a local file, and check that data.json sits next to index.html.</p></div>';
}

function getJson(url) {
  return fetch(url + '?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
}

// The editor also looks for the latest search results; the API copy is fresher than the Pages one.
function loadCandidates() {
  var pages = function () { return getJson('candidates.json'); };
  return getToken() ? readCandidatesApi().catch(pages) : pages();
}

getJson('data.json')
  .then(function (live) {
    if (!editorFromPage()) return start(live, null);
    return loadCandidates().then(function (c) { start(live, c); }, function () { start(live, null); });
  })
  .catch(fail);

})();
</script>
</body></html>
