"k":"politics","id":"om-5","n":48},{"c":"om","t":"HM Sultan Haitham issues two Royal Decrees","u":"https://www.muscatdaily.com/2026/10/05/h-m-sultan-haitham-issues-two-royal-decrees-6/","s":"Muscat Daily","d":"2026-10-05","k":"politics","id":"om-6","n":49},{"c":"om","t":"Two new committees formed to address medical grievances","u":"https://www.muscatdaily.com/2026/10/05/two-new-committees-formed-to-address-medical-grievances/","s":"Muscat Daily","d":"2026-10-05","k":"politics","id":"om-7","n":50},{"c":"om","t":"RO1bn urban development deals unveiled","u":"https://www.muscatdaily.com/2026/10/05/ro1bn-urban-development-deals-unveiled/","s":"Muscat Daily","d":"2026-10-05","k":"economy","id":"om-8","n":51},{"c":"om","t":"New era of cooperation takes shape between Oman and Kazakhstan","u":"https://www.muscatdaily.com/2026/10/06/new-era-of-cooperation-takes-shape-between-oman-and-kazakhstan/","s":"Muscat Daily","d":"2026-10-06","k":"politics","id":"om-9","n":52},{"c":"om","t":"12 sailors injured in attack on vessel near Oman","u":"https://www.muscatdaily.com/2026/10/06/12-sailors-injured-in-attack-on-vessel-near-oman/","s":"Muscat Daily","d":"2026-10-06","k":"emergency","id":"om-10","n":53},{"c":"iq","t":"Iraq considers raising official dollar rate to 1,500 IQD and dropping currency zeros","u":"https://www.iraqinews.com/iraq/iraq-considers-raising-official-dollar-rate-1500-iqd-currency-zeros-2026/","s":"Iraqi News","d":"2026-10-06","k":"economy","id":"iq-1","n":54},{"c":"iq","t":"Iraq welcomed record 10 million tourists in 2025","u":"https://www.iraqinews.com/iraq/iraq-welcomed-record-10-million-tourists-heritage-religious-sectors-2025-2026/","s":"Iraqi News","d":"2026-10-06","k":"economy","id":"iq-2","n":55},{"c":"iq","t":"Iraq's parliament to discuss 2027 budget with $48.8 billion deficit","u":"https://www.iraqinews.com/iraq/iraqs-parliament-to-discuss-2027-budget-with-48-8-billion-deficit/","s":"Iraqi News","d":"2026-10-05","k":"politics","id":"iq-3","n":56},{"c":"iq","t":"Iraq pledges $2.7 billion to stimulate economic growth","u":"https://www.iraqinews.com/iraq/iraq-pledges-2-7-billion-to-stimulate-economic-growth/","s":"Iraqi News","d":"2026-10-05","k":"economy","id":"iq-4","n":57},{"c":"iq","t":"Iraq plans to purchase large oil tankers","u":"https://www.iraqinews.com/iraq/iraq-plans-to-purchase-large-oil-tankers/","s":"Iraqi News","d":"2026-10-05","k":"logistics","id":"iq-5","n":58},{"c":"iq","t":"Iraq's Najaf receives first Iranian plane after US exemption","u":"https://www.iraqinews.com/iraq/iraqs-najaf-receive-first-iranian-plane-after-us-exemption/","s":"Iraqi News","d":"2026-10-05","k":"politics","id":"iq-6","n":59}],"selected":["sa-11","sa-2","sa-6","sa-16","sa-17","sa-5","ae-2","ae-1","ae-3","qa-5","qa-6","qa-8","qa-11","kw-6","kw-1","kw-5","bh-1","bh-4","om-1","om-2","iq-2","iq-4"],"footer":["Covers 5–6 October 2026. Stories were gathered by web search and publisher index pages, from English-language sources only.","Links go straight to the publisher. Countries with fewer stories had fewer items that could be date-confirmed.","One source supplies more than 60% of the stories for: UAE, Kuwait, Bahrain, Oman, Iraq."],"curatedAt":"2026-10-06T20:47:53.816Z"}</script>
<script id="app">(function () {
'use strict';

var DATA = JSON.parse(document.getElementById('data').textContent);
var CSS = document.getElementById('css').textContent;
var APP = document.getElementById('app').textContent;
var META = '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">';
var FONTS = '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">';

var CAT = {
  emergency: 'Emergency',
  economy: 'Economy',
  politics: 'Politics',
  ecommerce: 'E-commerce & retail',
  logistics: 'Logistics & shipping',
  payments: 'Payments & fintech',
  tax: 'Tax & incentives',
  turkey: 'T\u00fcrkiye link'
};
var CAT_ORDER = Object.keys(CAT);
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var FIRST_OPEN = 5;

var ids = {};
DATA.stories.forEach(function (s) { ids[s.id] = true; });

var DKEY = 'gmb:draft:' + DATA.edition.date;
var HINT = 'gmb:editor';

var published = new Set(DATA.selected);
var draft = loadDraft();
var isEditor = readHint();
var f = { country: 'all', cat: 'all', q: '', only: false };
var collapsed = {};
var expanded = {};
var busy = false;
var statusTimer = null;
var statusText = '';

var $ = function (id) { return document.getElementById(id); };

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : '#'; }
function fmtDay(iso) { var p = iso.split('-'); return MONTHS[+p[1] - 1] + ' ' + (+p[2]); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

function loadDraft() {
  try {
    var raw = localStorage.getItem(DKEY);
    if (raw) {
      var a = JSON.parse(raw);
      if (Array.isArray(a)) return new Set(a.filter(function (x) { return ids[x]; }));
    }
  } catch (e) {}
  return new Set(DATA.selected);
}
function saveDraft() {
  try { localStorage.setItem(DKEY, JSON.stringify(Array.from(draft))); } catch (e) {}
}
function readHint() {
  try { return localStorage.getItem(HINT) === '1'; } catch (e) { return false; }
}
function writeHint(v) {
  try { localStorage.setItem(HINT, v ? '1' : '0'); } catch (e) {}
}

function sameSet(a, b) {
  if (a.size !== b.size) return false;
  var ok = true;
  a.forEach(function (x) { if (!b.has(x)) ok = false; });
  return ok;
}
function rank(s) { return s.k === 'emergency' ? 0 : s.k === 'economy' ? 1 : 2; }
function sorted(list) {
  return list.slice().sort(function (a, b) {
    var r = rank(a) - rank(b);
    if (r) return r;
    if (a.d !== b.d) return a.d < b.d ? 1 : -1;
    return a.n - b.n;
  });
}
function pool() {
  return isEditor ? DATA.stories : DATA.stories.filter(function (s) { return published.has(s.id); });
}
function isSel(s) { return isEditor ? draft.has(s.id) : published.has(s.id); }
function match(s, skip) {
  if (skip !== 'country' && f.country !== 'all' && s.c !== f.country) return false;
  if (skip !== 'cat' && f.cat !== 'all' && s.k !== f.cat) return false;
  if (f.q && (s.t + ' ' + s.s).toLowerCase().indexOf(f.q.toLowerCase()) < 0) return false;
  if (isEditor && f.only && !draft.has(s.id)) return false;
  return true;
}
function filtering() { return f.country !== 'all' || f.cat !== 'all' || !!f.q || (isEditor && f.only); }

/* ---------- rendering ---------- */

function renderShell() {
  $('root').innerHTML =
    '<div class="wrap">' +
    '<header class="masthead"><p class="kicker">GCC + IRAQ \u00b7 DAILY SCAN</p><h1>Gulf Morning Brief</h1><div class="dateline" id="dateline"></div></header>' +
    '<div id="note"></div>' +
    '<div class="controls" id="controls">' +
      '<input class="search" id="q" type="search" placeholder="Search headlines" aria-label="Search headlines" autocomplete="off">' +
      '<div class="chips" id="cchips" role="group" aria-label="Filter by country"></div>' +
      '<div class="chips" id="kchips" role="group" aria-label="Filter by category"></div>' +
      '<div id="onlywrap"></div>' +
    '</div>' +
    '<main id="list"></main>' +
    '<footer id="foot"></footer>' +
    '</div><div id="barwrap"></div>';
}

function renderHead() {
  var p = pool();
  var countries = {};
  p.forEach(function (s) { countries[s.c] = true; });
  var nC = Object.keys(countries).length;
  var h = '<span><b>' + esc(DATA.edition.label) + '</b></span>';
  if (DATA.edition.windowLabel) h += '<span>' + esc(DATA.edition.windowLabel) + '</span>';
  if (isEditor) {
    h += '<span><b>' + DATA.stories.length + '</b> candidates \u00b7 <b>' + draft.size + '</b> selected</span>';
  } else if (published.size) {
    h += '<span><b>' + published.size + '</b> ' + (published.size === 1 ? 'story' : 'stories') + ' \u00b7 <b>' + nC + '</b> ' + (nC === 1 ? 'country' : 'countries') + '</span>';
  } else {
    h += '<span>Selection pending</span>';
  }
  if (DATA.edition.scanned) h += '<span>scanned ' + esc(DATA.edition.scanned) + '</span>';
  $('dateline').innerHTML = h;
}

function renderNote() {
  $('note').innerHTML = isEditor
    ? '<p class="editor-note"><b>Editor view.</b> Tick the stories to publish. Readers only see the stories you publish, and they cannot select.</p>'
    : '';
  document.body.classList.toggle('editor', isEditor);
}

function chipHtml(attr, val, label, count, active, alarm) {
  return '<button type="button" class="fchip' + (alarm ? ' alarm' : '') + '" data-' + attr + '="' + esc(val) + '" aria-pressed="' + (active ? 'true' : 'false') + '">' +
    esc(label) + '<span class="n">' + count + '</span></button>';
}

function renderControls() {
  var p = pool();
  var cc = chipHtml('country', 'all', 'All', p.filter(function (s) { return match(s, 'country'); }).length, f.country === 'all');
  DATA.countries.forEach(function (c) {
    if (!p.some(function (s) { return s.c === c.id; })) return;
    var n = p.filter(function (s) { return s.c === c.id && match(s, 'country'); }).length;
    cc += chipHtml('country', c.id, c.short, n, f.country === c.id);
  });
  $('cchips').innerHTML = cc;

  var kc = chipHtml('cat', 'all', 'All topics', p.filter(function (s) { return match(s, 'cat'); }).length, f.cat === 'all');
  CAT_ORDER.forEach(function (k) {
    if (!p.some(function (s) { return s.k === k; })) return;
    var n = p.filter(function (s) { return s.k === k && match(s, 'cat'); }).length;
    kc += chipHtml('cat', k, CAT[k], n, f.cat === k, k === 'emergency');
  });
  $('kchips').innerHTML = kc;

  $('onlywrap').innerHTML = isEditor
    ? '<label class="onlysel"><input type="checkbox" id="only"' + (f.only ? ' checked' : '') + '> Only selected</label>'
    : '';
  $('controls').hidden = pool().length === 0;
}

function storyHtml(s) {
  var sel = isSel(s);
  var pick = isEditor
    ? '<label class="pick"><input type="checkbox" data-pick="' + esc(s.id) + '"' + (sel ? ' checked' : '') + ' aria-label="Select: ' + esc(s.t) + '"></label>'
    : '';
  var chips = '<span class="chip' + (s.k === 'emergency' ? ' alarm' : '') + '">' + esc(CAT[s.k] || s.k) + '</span>' +
    (s.r ? '<span class="chip outline">roundup</span>' : '');
  return '<li class="story' + (isEditor && sel ? ' sel' : '') + '">' + pick +
    '<div class="body"><a class="headline" href="' + esc(safeUrl(s.u)) + '" target="_blank" rel="noopener noreferrer">' + esc(s.t) + '</a>' +
    '<div class="meta">' + chips + '<span class="src">' + esc(s.s) + '</span><span class="sep">\u00b7</span><span class="time">' + fmtDay(s.d) + '</span></div></div></li>';
}

function renderList() {
  var act = document.activeElement;
  var keepId = act && act.getAttribute && act.getAttribute('data-pick');
  var p = pool();
  var fl = filtering();
  var html = '';
  var shown = 0;

  if (!isEditor && p.length === 0) {
    $('list').innerHTML = '<p class="empty">Today\u2019s stories haven\u2019t been selected yet. Check back soon.</p>';
    return;
  }

  DATA.countries.forEach(function (c) {
    var all = p.filter(function (s) { return s.c === c.id; });
    if (!all.length && (fl || !isEditor)) return;
    var list = sorted(all.filter(function (s) { return match(s); }));
    if (fl && !list.length) return;
    shown += list.length;

    var open = !collapsed[c.id];
    var limit = fl || expanded[c.id] ? list.length : FIRST_OPEN;
    var meta = esc(c.capital) + '<span class="dot"> \u00b7 </span>';
    if (isEditor) {
      var nSel = all.filter(function (s) { return draft.has(s.id); }).length;
      meta += nSel + ' of ' + plural(all.length, 'story', 'stories') + ' selected';
    } else {
      meta += plural(all.length, 'story', 'stories');
    }

    html += '<section class="country"><h2 class="chead"><button type="button" class="ctoggle" data-toggle="' + c.id + '" aria-expanded="' + open + '" aria-controls="list-' + c.id + '">' +
      '<span class="cname">' + esc(c.name) + '</span><span class="cmeta">' + meta + '</span><span class="chev" aria-hidden="true"></span></button></h2>';
    if (open) {
      if (!all.length) {
        html += '<p class="empty">No verified stories for this country in this edition.</p>';
      } else {
        html += '<ol class="items" id="list-' + c.id + '">' + list.slice(0, limit).map(storyHtml).join('') + '</ol>';
        if (list.length > limit) {
          html += '<button type="button" class="more" data-more="' + c.id + '">Show ' + (list.length - limit) + ' more</button>';
        }
      }
    }
    html += '</section>';
  });

  if (fl && shown === 0) {
    html = '<p class="empty">No stories match these filters.<button type="button" data-reset="1">Clear filters</button></p>';
  }
  $('list').innerHTML = html;

  if (keepId) {
    var el = $('list').querySelector('[data-pick="' + keepId + '"]');
    if (el) el.focus();
  }
}

function fmtStamp(iso) {
  try {
    return new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Istanbul' }).format(new Date(iso)) + ' Istanbul';
  } catch (e) { return ''; }
}

function renderFoot() {
  var h = (DATA.footer || []).map(function (l) { return esc(l); }).join('<br>');
  var ck = DATA.checks;
  if (ck) {
    h += '<br>Every link was checked before publishing. Left out: ' + ck.dead + ' that did not open, ' + ck.nodate + ' without a verifiable date, ' + ck.paywall + ' behind a paywall.';
  }
  h += '<br><b>Refreshed daily at 11:29 Istanbul</b>';
  if (DATA.edition.updated) h += ' \u00b7 last scan ' + esc(DATA.edition.updated);
  if (DATA.curatedAt) {
    var st = fmtStamp(DATA.curatedAt);
    if (st) h += ' \u00b7 selection published ' + esc(st);
  }
  $('foot').innerHTML = h;
}

function renderBar() {
  var w = $('barwrap');
  if (!isEditor) { w.innerHTML = ''; return; }
  var dirty = !sameSet(draft, published);
  w.innerHTML =
    '<div class="bar" role="region" aria-label="Editor actions"><div class="bar-in">' +
    '<div class="bar-info"><b>' + draft.size + '</b> selected' + (dirty ? ' \u00b7 unpublished changes' : ' \u00b7 published') +
    '<span class="bar-status" id="status" aria-live="polite">' + esc(statusText) + '</span></div>' +
    '<div class="bar-actions">' +
    '<button type="button" class="btn" data-act="clear"' + (draft.size && !busy ? '' : ' disabled') + '>Clear</button>' +
    '<button type="button" class="btn" data-act="copy"' + (draft.size ? '' : ' disabled') + '>Copy</button>' +
    '<button type="button" class="btn primary" data-act="publish"' + (dirty && !busy ? '' : ' disabled') + '>Publish ' + plural(draft.size, 'story', 'stories') + '</button>' +
    '</div></div></div>';
}

function renderAll() {
  renderNote();
  renderHead();
  renderControls();
  renderList();
  renderFoot();
  renderBar();
}

function setStatus(t, keep) {
  statusText = t;
  var el = $('status');
  if (el) el.textContent = t;
  clearTimeout(statusTimer);
  if (t && !keep) statusTimer = setTimeout(function () { statusText = ''; var e2 = $('status'); if (e2) e2.textContent = ''; }, 4000);
}

/* ---------- actions ---------- */

function copySelected() {
  var lines = ['Gulf Morning Brief \u00b7 ' + DATA.edition.titleDate];
  DATA.countries.forEach(function (c) {
    var list = sorted(DATA.stories.filter(function (s) { return s.c === c.id && draft.has(s.id); }));
    if (!list.length) return;
    lines.push('', c.name);
    list.forEach(function (s) { lines.push('- ' + s.t + ' (' + s.s + ', ' + fmtDay(s.d) + ') ' + s.u); });
  });
  var text = lines.join('\n');
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    setStatus(ok ? 'Copied ' + plural(draft.size, 'story', 'stories') + '.' : 'Copy isn\u2019t available in this view.');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      setStatus('Copied ' + plural(draft.size, 'story', 'stories') + '.');
    }, fallback);
  } else {
    fallback();
  }
}

function buildDoc(state) {
  var n = state.selected.length;
  var title = 'Gulf Morning Brief \u00b7 ' + state.edition.titleDate + (n ? ' \u00b7 ' + plural(n, 'story', 'stories') : '');
  var json = JSON.stringify(state).replace(/</g, '\\u003c');
  return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8">' + META +
    '<title>' + esc(title) + '</title>' + FONTS +
    '<style id="css">' + CSS + '</style></head><body>\n<div id="root"></div>\n' +
    '<script type="application/json" id="data">' + json + '<\/script>\n' +
    '<script id="app">' + APP + '<\/script>\n</body></html>';
}

function publish() {
  if (busy || sameSet(draft, published)) return;
  busy = true;
  setStatus('Publishing\u2026', true);
  renderBar();
  var next = JSON.parse(JSON.stringify(DATA));
  next.selected = Array.from(draft);
  next.curatedAt = new Date().toISOString();
  Promise.resolve()
    .then(function () { return window.claude.use('artifact'); })
    .then(function (a) {
      if (!a) throw { code: 'not_granted' };
      return a.publish(buildDoc(next));
    })
    .then(function () { setStatus('Published. Reloading\u2026', true); })
    .catch(function (e) {
      busy = false;
      var c = e && e.code;
      var msg = c === 'conflict' ? 'A newer version was published. This page is reloading.'
        : (c === 'not_writer' || c === 'not_granted' || c === 'capability_disabled') ? 'Publishing isn\u2019t available for your account here.'
        : c === 'rate_limited' ? 'Too many publishes. Wait a moment and try again.'
        : 'Couldn\u2019t publish. Your selection is kept; try again.';
      renderBar();
      setStatus(msg);
    });
}

function onClick(e) {
  var t = e.target.closest('[data-country],[data-cat],[data-toggle],[data-more],[data-act],[data-reset]');
  if (!t) return;
  if (t.hasAttribute('data-country')) { f.country = t.getAttribute('data-country'); renderControls(); renderList(); return; }
  if (t.hasAttribute('data-cat')) { f.cat = t.getAttribute('data-cat'); renderControls(); renderList(); return; }
  if (t.hasAttribute('data-toggle')) { var c = t.getAttribute('data-toggle'); collapsed[c] = !collapsed[c]; renderList(); return; }
  if (t.hasAttribute('data-more')) { expanded[t.getAttribute('data-more')] = true; renderList(); return; }
  if (t.hasAttribute('data-reset')) { f = { country: 'all', cat: 'all', q: '', only: false }; $('q').value = ''; renderControls(); renderList(); return; }
  var act = t.getAttribute('data-act');
  if (act === 'clear') { draft = new Set(); saveDraft(); renderHead(); renderControls(); renderList(); renderBar(); }
  if (act === 'copy') copySelected();
  if (act === 'publish') publish();
}

function onChange(e) {
  var t = e.target;
  if (t.hasAttribute && t.hasAttribute('data-pick')) {
    var id = t.getAttribute('data-pick');
    if (t.checked) draft.add(id); else draft.delete(id);
    saveDraft();
    renderHead();
    if (f.only) renderControls();
    renderList();
    renderBar();
    return;
  }
  if (t.id === 'only') { f.only = t.checked; renderControls(); renderList(); }
}

function setEditor(v) {
  if (v === isEditor) { writeHint(v); return; }
  isEditor = v;
  writeHint(v);
  f.only = false;
  renderAll();
}

function detectEditor() {
  if (!window.claude || typeof window.claude.use !== 'function') { if (isEditor) setEditor(false); return; }
  window.claude.use('user')
    .then(function (u) { return u ? u.canEdit() : false; })
    .then(function (ok) { setEditor(!!ok); })
    .catch(function () { setEditor(false); });
}

/* ---------- start ---------- */

renderShell();
$('root').addEventListener('click', onClick);
$('root').addEventListener('change', onChange);
$('q').addEventListener('input', function (e) { f.q = e.target.value.trim(); renderControls(); renderList(); });
renderAll();
detectEditor();

})();
</script>
</body></html>
